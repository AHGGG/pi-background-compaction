name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package
        run: npm run check

      - name: Test package
        run: npm test

      - name: Check out compatible compaction engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AHGGG/pi-extensions
          ref: 39d939076f6ca1eedf04265e0670bf5bcbf2d386
          path: .integration-core
          persist-credentials: false

      - name: Test paired compaction engine
        run: npm run test:integration -- .integration-core
        env:
          REQUIRE_PREPARATION_DIAGNOSTICS: "1"
          REQUIRE_CONSUMER_FAILURE_REPORTING: "1"
          REQUIRE_TEXT_SUMMARY: "1"

      - name: Inspect the npm package
        run: npm pack --dry-run

  release:
    name: Update release pull request
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions match
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          result="$(mktemp)"
          trap 'rm -f "$result"' EXIT
          if npm view "$package_name@$package_version" version --json >"$result"; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "$package_name@$package_version is already published; skipping npm publish."
          elif node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.exit(result.error?.code === "E404" ? 0 : 1);
          ' "$result"; then
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Registry lookup failed; refusing to publish without a reliable version check." >&2
            exit 1
          fi

      - name: Verify npm supports Trusted Publishing
        run: |
          node --input-type=module -e '
            import { execSync } from "node:child_process";
            const version = execSync("npm --version", { encoding: "utf8" }).trim();
            const [major, minor, patch] = version.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error(`npm ${version} does not support Trusted Publishing; need >=11.5.1`);
            }
          '

      - name: Publish package
        if: steps.registry.outputs.already-published != 'true'
        run: npm publish
